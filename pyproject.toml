[project]
name = "cib7explorer"
version = "0.1.0"
description = "Read-only explorer for the process history of a CIB seven / Camunda 7 engine"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Felix Neubauer" }]
keywords = ["camunda", "cib-seven", "bpmn", "process-mining", "postgresql", "read-only"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "psycopg[binary,pool]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.20",
]

[project.urls]
Homepage = "https://github.com/felixn95/cib-7-historic-process-explorer"
Source = "https://github.com/felixn95/cib-7-historic-process-explorer"
Issues = "https://github.com/felixn95/cib-7-historic-process-explorer/issues"

[project.optional-dependencies]
# Login against an OIDC provider. Only needed where the interface is not on a development
# machine -- locally the tool runs without these packages.
# httpx belongs here: authlib.integrations.starlette_client imports it. Without this line the
# service only fails when starting in a container -- locally httpx is present through the dev
# extra and the omission is invisible.
oidc = ["authlib>=1.3", "itsdangerous>=2.2", "httpx>=0.28"]

dev = ["pytest>=8.3", "httpx>=0.28", "authlib>=1.3", "itsdangerous>=2.2"]

[project.scripts]
cib7explorer = "cib7explorer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cib7explorer"]

[tool.pytest.ini_options]
# The default run stays fast and needs no database.
# Run integration tests explicitly with `-m integration`.
addopts = "-m 'not integration'"
markers = ["integration: needs a reachable engine database (profile via CIB7_TEST_PROFILE)"]
