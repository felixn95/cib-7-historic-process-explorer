# Publish the container image to the GitHub Container Registry.
#
# ghcr.io rather than a separate registry: the token that Actions already has is enough, so
# there is no credential to store, rotate or leak, and the package inherits the repository's
# access rules instead of needing its own.
name: image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The tests are the gate. An image that fails them should not exist in the registry at
      # all, because the tag would outlive the knowledge that it is broken.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Unit tests
        run: |
          uv sync --all-extras
          uv run pytest -q

      # arm64 is built through emulation. The image is pure Python with binary wheels, so there
      # is nothing to compile and the emulated build stays cheap -- on a native runner it would
      # be faster, but not enough to be worth a second job.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A push to main is the moving development head and gets `main` plus its commit sha.
          # A version tag gets the three usual semver tags -- and only then does `latest` move,
          # so that `latest` on a server never means "whatever was merged an hour ago".
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=CIB seven / Camunda 7 process explorer
            org.opencontainers.image.description=Read-only explorer for the process history of a CIB seven or Camunda 7 engine on PostgreSQL
            org.opencontainers.image.licenses=Apache-2.0

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance and SBOM attestations are off deliberately, not by oversight: they add
          # attestation manifests to the image index, which show up as extra "unknown/unknown"
          # platform entries in some tooling. Turn them on once the pull side is settled.
          provenance: false
          sbom: false

      - name: What was published
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Pull it with:"
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
